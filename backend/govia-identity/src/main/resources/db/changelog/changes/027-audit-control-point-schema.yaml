databaseChangeLog:

  # ===================== Danh muc "Chot kiem soat" (sheet ZTC_CKS, bang ZTB_CKS) =====================
  - changeSet:
      id: 027-1-audit-control-point-schema
      author: govia
      comment: "Tao bang audit_control_point"
      changes:
        - createTable:
            tableName: audit_control_point
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true } }
              - column: { name: tenant_id, type: UUID, constraints: { nullable: false } }
              - column: { name: business_segment_id, type: UUID }
              - column: { name: code, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: possible_risk, type: VARCHAR(500) }
              - column: { name: control_point_by_step, type: VARCHAR(1000) }
              - column: { name: actual_control, type: VARCHAR(1000) }
              - column: { name: control_type, type: VARCHAR(20) }
              - column: { name: control_frequency, type: VARCHAR(20) }
              - column: { name: audit_procedure, type: VARCHAR(1000) }
              - column: { name: residual_risk_assessment, type: VARCHAR(1000) }
              - column: { name: process_regulation, type: VARCHAR(255) }
              - column: { name: reference_clause, type: VARCHAR(500) }
              - column: { name: process_effectiveness, type: VARCHAR(255) }
              - column: { name: control_effectiveness_assessment, type: VARCHAR(1000) }
              - column: { name: control_efficiency_assessment, type: VARCHAR(1000) }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(64) }
              - column: { name: updated_at, type: TIMESTAMP }
              - column: { name: updated_by, type: VARCHAR(64) }
              - column: { name: row_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: audit_control_point
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_audit_control_point_tenant
        - addForeignKeyConstraint:
            baseTableName: audit_control_point
            baseColumnNames: business_segment_id
            referencedTableName: audit_master_data_item
            referencedColumnNames: id
            constraintName: fk_audit_control_point_business_segment
        - addUniqueConstraint:
            tableName: audit_control_point
            columnNames: tenant_id, code
            constraintName: uk_audit_control_point_tenant_code
