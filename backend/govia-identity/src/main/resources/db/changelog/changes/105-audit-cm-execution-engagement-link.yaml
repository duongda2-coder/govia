databaseChangeLog:

  # ===================== "Thuc hien kiem toan": them lien ket Cuoc kiem toan + Nguoi duoc phan cong
  # + Ma BQT_TH cho ca 15 man hinh chon mau (CM_TD1/TD2, CM_NTD1-14, khong co NTD5) =====================
  - changeSet:
      id: 105-1-audit-cm-td1-engagement-link
      author: govia
      comment: "Them engagement_id/assigned_employee_id/process_step_summary_id vao audit_cm_td1"
      changes:
        - addColumn:
            tableName: audit_cm_td1
            columns:
              - column: { name: engagement_id, type: UUID }
              - column: { name: assigned_employee_id, type: UUID }
              - column: { name: process_step_summary_id, type: UUID }
        - addForeignKeyConstraint: { baseTableName: audit_cm_td1, baseColumnNames: engagement_id, referencedTableName: audit_engagement, referencedColumnNames: id, constraintName: fk_audit_cm_td1_engagement }
        - addForeignKeyConstraint: { baseTableName: audit_cm_td1, baseColumnNames: assigned_employee_id, referencedTableName: employee, referencedColumnNames: id, constraintName: fk_audit_cm_td1_assignee }
        - addForeignKeyConstraint: { baseTableName: audit_cm_td1, baseColumnNames: process_step_summary_id, referencedTableName: audit_process_step_summary, referencedColumnNames: id, constraintName: fk_audit_cm_td1_step_summary }

