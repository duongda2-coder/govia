databaseChangeLog:

  # ===================== Module "Cham diem rui ro" - song song voi Audit Master Data =====================
  # 10 bang rieng (khong dung 1 bang da hinh nhu audit_master_data_item) vi moi danh muc co hinh dang du
  # lieu that su khac nhau (trong so, he so, ma tran, phan quyen user...) - dung theo dung 10 sheet cua tai
  # lieu dac ta "Cham diem - master data.xlsx" (bo qua sheet trong).

  - changeSet:
      id: 015-1-risk-score-group1
      author: govia
      changes:
        - createTable:
            tableName: risk_score_group1
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true } }
              - column: { name: tenant_id, type: UUID, constraints: { nullable: false } }
              - column: { name: object_type, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: code, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: weight, type: "NUMERIC(9,4)" }
              - column: { name: valid_from, type: DATE }
              - column: { name: valid_to, type: DATE }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(64) }
              - column: { name: updated_at, type: TIMESTAMP }
              - column: { name: updated_by, type: VARCHAR(64) }
              - column: { name: row_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: risk_score_group1
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_risk_score_group1_tenant
        - addUniqueConstraint:
            tableName: risk_score_group1
            columnNames: tenant_id, object_type, code
            constraintName: uk_risk_score_group1_tenant_type_code

