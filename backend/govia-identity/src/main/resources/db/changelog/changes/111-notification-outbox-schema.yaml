databaseChangeLog:

  # ===================== NOTIFICATION_OUTBOX: "hop thu di" cho thong bao workflow =====================
  # Xem com.govia.identity.notification.LoggingWorkflowNotificationService: chua bat gui mail that
  # (govia.notification.email.enabled=false mac dinh) nen moi thong bao "co task moi" duoc ghi lai o
  # day thay vi mat, san sang gui bu khi bat SMTP that.
  - changeSet:
      id: 111-1-notification-outbox-schema
      author: govia
      changes:
        - createTable:
            tableName: notification_outbox
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true } }
              - column: { name: tenant_id, type: UUID, constraints: { nullable: false } }
              - column: { name: recipient_user_id, type: VARCHAR(100) }
              - column: { name: recipient_email, type: VARCHAR(255) }
              - column: { name: subject, type: VARCHAR(500), constraints: { nullable: false } }
              - column: { name: body, type: VARCHAR(4000), constraints: { nullable: false } }
              - column: { name: sent, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: sent_at, type: TIMESTAMP }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(64) }
              - column: { name: updated_at, type: TIMESTAMP }
              - column: { name: updated_by, type: VARCHAR(64) }
              - column: { name: row_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: notification_outbox
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_notification_outbox_tenant
        - createIndex:
            tableName: notification_outbox
            indexName: ix_notification_outbox_tenant
            columns:
              - column: { name: tenant_id }
