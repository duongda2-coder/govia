databaseChangeLog:

  # ===================== Theo doi khac phuc kien nghi (TDKP) - file "6.TDKP_29.5.2026.xlsx" =====================
  - changeSet:
      id: 175-audit_tdkp_assignment
      author: govia
      comment: "TDKP - Phan cong theo doi khac phuc (ZTC_TDKP_PC): scope CEO=HDTV/TGD, BRANCH=Chi nhanh"
      changes:
        - createTable:
            tableName: audit_tdkp_assignment
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true } }
              - column: { name: tenant_id, type: UUID, constraints: { nullable: false } }
              - column: { name: scope, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: recommendation_type_id, type: UUID }
              - column: { name: business_segment_id, type: UUID }
              - column: { name: target_object, type: VARCHAR(10) }
              - column: { name: audit_object_unit_id, type: UUID }
              - column: { name: geographic_area_id, type: UUID }
              - column: { name: employee_id, type: UUID, constraints: { nullable: false } }
              - column: { name: start_date, type: DATE }
              - column: { name: end_date, type: DATE }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(64) }
              - column: { name: updated_at, type: TIMESTAMP }
              - column: { name: updated_by, type: VARCHAR(64) }
              - column: { name: row_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: audit_tdkp_assignment
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_tdkp_assignment_tenant

  - changeSet:
      id: 175-audit_tdkp_ceo_recommendation
      author: govia
      comment: "TDKP - Kien nghi cua KTNB doi voi HDTV/TGD (ZTC_TDKP_CEO_ALL / ZTC_TDKP_CEO_KH): scope ALL | KH"
      changes:
        - createTable:
            tableName: audit_tdkp_ceo_recommendation
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true } }
              - column: { name: tenant_id, type: UUID, constraints: { nullable: false } }
              - column: { name: scope, type: VARCHAR(5), constraints: { nullable: false } }
              - column: { name: source_id, type: UUID }
              - column: { name: report_number, type: VARCHAR(50) }
              - column: { name: report_date, type: DATE }
              - column: { name: content, type: VARCHAR(2000), constraints: { nullable: false } }
              - column: { name: recommendation_type_id, type: UUID }
              - column: { name: business_segment_id, type: UUID }
              - column: { name: target_object, type: VARCHAR(10) }
              - column: { name: executing_unit_id, type: UUID }
              - column: { name: directive, type: VARCHAR(500) }
              - column: { name: deadline, type: DATE }
              - column: { name: status, type: VARCHAR(20) }
              - column: { name: evaluation, type: VARCHAR(500) }
              - column: { name: note, type: VARCHAR(500) }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(64) }
              - column: { name: updated_at, type: TIMESTAMP }
              - column: { name: updated_by, type: VARCHAR(64) }
              - column: { name: row_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: audit_tdkp_ceo_recommendation
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_tdkp_ceo_recommendation_tenant
        - addUniqueConstraint:
            tableName: audit_tdkp_ceo_recommendation
            columnNames: tenant_id, scope, source_id
            constraintName: uk_tdkp_ceo_rec_scope_source

