databaseChangeLog:

  # ===================== Demo gui email (Quan tri he thong > Demo gui email) =====================
  # Chuc nang DOC LAP, khong lien quan quy trinh nghiep vu: chi them 2 bang moi tien to email_demo_.
  # Xoa 2 bang nay khong anh huong bat ky du lieu/nghiep vu nao khac.
  - changeSet:
      id: 187-1-email-demo-schema
      author: govia
      comment: "Cau hinh SMTP (1 dong/tenant) + lich su gui mail demo"
      changes:
        - createTable:
            tableName: email_demo_setting
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true } }
              - column: { name: tenant_id, type: UUID, constraints: { nullable: false, unique: true, uniqueConstraintName: uq_email_demo_setting_tenant } }
              - column: { name: host, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: port, type: INT, constraints: { nullable: false } }
              - column: { name: username, type: VARCHAR(255) }
              - column: { name: password, type: VARCHAR(500) }
              - column: { name: smtp_auth, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: starttls, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: ssl, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: from_address, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: from_name, type: VARCHAR(255) }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(64) }
              - column: { name: updated_at, type: TIMESTAMP }
              - column: { name: updated_by, type: VARCHAR(64) }
              - column: { name: row_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: email_demo_setting
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_email_demo_setting_tenant
        - createTable:
            tableName: email_demo_log
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true } }
              - column: { name: tenant_id, type: UUID, constraints: { nullable: false } }
              - column: { name: to_address, type: VARCHAR(1000), constraints: { nullable: false } }
              - column: { name: cc_address, type: VARCHAR(1000) }
              - column: { name: subject, type: VARCHAR(500), constraints: { nullable: false } }
              - column: { name: body, type: VARCHAR(10000) }
              - column: { name: html, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: success, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: error_message, type: VARCHAR(2000) }
              - column: { name: smtp_host, type: VARCHAR(255) }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(64) }
              - column: { name: updated_at, type: TIMESTAMP }
              - column: { name: updated_by, type: VARCHAR(64) }
              - column: { name: row_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: email_demo_log
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_email_demo_log_tenant
        - createIndex:
            tableName: email_demo_log
            indexName: ix_email_demo_log_tenant_created
            columns:
              - column: { name: tenant_id }
              - column: { name: created_at }
