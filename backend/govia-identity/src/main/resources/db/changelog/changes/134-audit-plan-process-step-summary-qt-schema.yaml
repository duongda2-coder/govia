databaseChangeLog:

  # ===================== Danh muc "Buoc quy trinh tong hop" (sheet ZTC_BQT_TH_QT) =====================
  - changeSet:
      id: 134-1-audit-plan-process-step-summary-qt-schema
      author: govia
      comment: "Tao bang audit_process_step_summary_qt"
      changes:
        - createTable:
            tableName: audit_process_step_summary_qt
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true } }
              - column: { name: tenant_id, type: UUID, constraints: { nullable: false } }
              - column: { name: business_segment_id, type: UUID }
              - column: { name: code, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: work_item_id, type: UUID }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(64) }
              - column: { name: updated_at, type: TIMESTAMP }
              - column: { name: updated_by, type: VARCHAR(64) }
              - column: { name: row_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: audit_process_step_summary_qt
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_audit_pssq_tenant
        - addForeignKeyConstraint:
            baseTableName: audit_process_step_summary_qt
            baseColumnNames: business_segment_id
            referencedTableName: audit_master_data_item
            referencedColumnNames: id
            constraintName: fk_audit_pssq_business_segment
        - addForeignKeyConstraint:
            baseTableName: audit_process_step_summary_qt
            baseColumnNames: work_item_id
            referencedTableName: audit_work_item_qt
            referencedColumnNames: id
            constraintName: fk_audit_pssq_work_item
        - addUniqueConstraint:
            tableName: audit_process_step_summary_qt
            columnNames: tenant_id, code
            constraintName: uk_audit_pssq_tenant_code
