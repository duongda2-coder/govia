databaseChangeLog:

  # ===================== "Thuc hien kiem toan": Danh sach chon mau LC va nho thu TTQT (sheet ZTC_CM_NTD4, phu luc 06B/BKS-KTNB) =====================
  - changeSet:
      id: 074-1-audit-plan-cm-ntd4-schema
      author: govia
      comment: "Tao bang audit_cm_ntd4"
      changes:
        - createTable:
            tableName: audit_cm_ntd4
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true } }
              - column: { name: tenant_id, type: UUID, constraints: { nullable: false } }
              - column: { name: branch_code, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: reference_number, type: "DECIMAL(20,2)", constraints: { nullable: false } }
              - column: { name: open_date, type: DATE, constraints: { nullable: false } }
              - column: { name: customer_code, type: VARCHAR(50) }
              - column: { name: customer_name, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: amount, type: "DECIMAL(20,2)" }
              - column: { name: beneficiary, type: VARCHAR(20) }
              - column: { name: audit_result, type: VARCHAR(120) }
              - column: { name: recommendation_type, type: VARCHAR(120) }
              - column: { name: transaction_staff, type: VARCHAR(120) }
              - column: { name: control_user, type: VARCHAR(120) }
              - column: { name: control_staff, type: VARCHAR(120) }
              - column: { name: control_staff_title, type: VARCHAR(120) }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(64) }
              - column: { name: updated_at, type: TIMESTAMP }
              - column: { name: updated_by, type: VARCHAR(64) }
              - column: { name: row_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: audit_cm_ntd4
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_audit_cm_ntd4_tenant
        - addUniqueConstraint:
            tableName: audit_cm_ntd4
            columnNames: tenant_id, branch_code, reference_number, open_date, customer_name
            constraintName: uk_audit_cm_ntd4_tenant_branch_ref_date_customer
