              - column: { name: tenant_id, type: UUID, constraints: { nullable: false } }
              - column: { name: audit_engagement_id, type: UUID, constraints: { nullable: false } }
              - column: { name: audit_object_unit_id, type: UUID, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(64) }
              - column: { name: updated_at, type: TIMESTAMP }
              - column: { name: updated_by, type: VARCHAR(64) }
              - column: { name: row_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: audit_engagement_related_unit
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_audit_engagement_related_unit_tenant
        - addForeignKeyConstraint:
            baseTableName: audit_engagement_related_unit
            baseColumnNames: audit_engagement_id
            referencedTableName: audit_engagement
            referencedColumnNames: id
            constraintName: fk_audit_engagement_related_unit_engagement
        - addForeignKeyConstraint:
            baseTableName: audit_engagement_related_unit
            baseColumnNames: audit_object_unit_id
            referencedTableName: risk_score_audit_object_unit
            referencedColumnNames: id
            constraintName: fk_audit_engagement_related_unit_object_unit
        - addUniqueConstraint:
            tableName: audit_engagement_related_unit
            columnNames: audit_engagement_id, audit_object_unit_id
            constraintName: uk_audit_engagement_related_unit_pair

