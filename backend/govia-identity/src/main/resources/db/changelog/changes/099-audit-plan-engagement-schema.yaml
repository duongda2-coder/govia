databaseChangeLog:

  # ===================== "Lap ke hoach": Khoi tao va quan ly cuoc kiem toan (CKT) - file "Tao CKT.xlsx", sheet "khoi tao" + "quan ly DKT" =====================
  - changeSet:
      id: 099-1-audit-engagement-schema
      author: govia
      comment: "Tao bang audit_engagement (CKT)"
      changes:
        - createTable:
            tableName: audit_engagement
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true } }
              - column: { name: tenant_id, type: UUID, constraints: { nullable: false } }
              - column: { name: code, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: audit_object_unit_id, type: UUID, constraints: { nullable: false } }
              - column: { name: engagement_year, type: INT, constraints: { nullable: false } }
              - column: { name: expected_month, type: INT, constraints: { nullable: false } }
              - column: { name: decision_date, type: DATE, constraints: { nullable: false } }
              - column: { name: team_lead_employee_id, type: UUID, constraints: { nullable: false } }
              - column: { name: decision_number, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(20), defaultValue: DRAFT, constraints: { nullable: false } }
              - column: { name: risk_rank, type: VARCHAR(20) }
              - column: { name: name, type: VARCHAR(255) }
              - column: { name: objective, type: VARCHAR(4000) }
              - column: { name: scope, type: VARCHAR(4000) }
              - column: { name: planning_start_date, type: DATE }
              - column: { name: planning_end_date, type: DATE }
              - column: { name: fieldwork_start_date, type: DATE }
              - column: { name: fieldwork_end_date, type: DATE }
              - column: { name: report_start_date, type: DATE }
              - column: { name: report_end_date, type: DATE }
              - column: { name: info_collection_start, type: TIMESTAMP }
              - column: { name: info_collection_end, type: TIMESTAMP }
              - column: { name: sample_request_start, type: TIMESTAMP }
              - column: { name: sample_request_end, type: TIMESTAMP }
              - column: { name: report_plan_start, type: TIMESTAMP }
              - column: { name: report_plan_end, type: TIMESTAMP }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(64) }
              - column: { name: updated_at, type: TIMESTAMP }
              - column: { name: updated_by, type: VARCHAR(64) }
              - column: { name: row_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: audit_engagement
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_audit_engagement_tenant
        - addForeignKeyConstraint:
            baseTableName: audit_engagement
            baseColumnNames: audit_object_unit_id
            referencedTableName: risk_score_audit_object_unit
            referencedColumnNames: id
            constraintName: fk_audit_engagement_object_unit
        - addForeignKeyConstraint:
            baseTableName: audit_engagement
            baseColumnNames: team_lead_employee_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_audit_engagement_team_lead
        - addUniqueConstraint:
            tableName: audit_engagement
            columnNames: tenant_id, code
            constraintName: uk_audit_engagement_tenant_code

  - changeSet:
      id: 099-2-audit-engagement-related-unit-schema
      author: govia
      comment: "Tao bang audit_engagement_related_unit (Don vi lien quan)"
      changes:
