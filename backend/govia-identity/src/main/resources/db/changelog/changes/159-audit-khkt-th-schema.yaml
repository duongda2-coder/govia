databaseChangeLog:

  # ===================== "Danh sach DTKT nam cua Phong ke hoach" (sheet ZTC_KHKT_TH, Phan 1 + Phan 2) =====================
  - changeSet:
      id: 159-1-audit-khkt-th-candidate-schema
      author: govia
      comment: "Tao bang audit_khkt_th_candidate (Phan 1 - nhap/sua)"
      changes:
        - createTable:
            tableName: audit_khkt_th_candidate
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true } }
              - column: { name: tenant_id, type: UUID, constraints: { nullable: false } }
              - column: { name: khkt_year, type: INT, constraints: { nullable: false } }
              - column: { name: source_type, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: audit_object_code, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: audit_object_name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: audit_object_category_code, type: VARCHAR(20) }
              - column: { name: risk_score, type: "DECIMAL(12,4)" }
              - column: { name: rank_label, type: VARCHAR(50) }
              - column: { name: audit_object_unit_id, type: UUID }
              - column: { name: on_balance_sheet_loan, type: "DECIMAL(20,2)" }
              - column: { name: funding_source, type: "DECIMAL(20,2)" }
              - column: { name: bp_review_result, type: VARCHAR(250) }
              - column: { name: proposal_basis_th, type: VARCHAR(120) }
              - column: { name: expert_opinion, type: VARCHAR(250) }
              - column: { name: selection1, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: selection2, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: selection3, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(64) }
              - column: { name: updated_at, type: TIMESTAMP }
              - column: { name: updated_by, type: VARCHAR(64) }
              - column: { name: row_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: audit_khkt_th_candidate
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_audit_khkt_th_candidate_tenant
        - addForeignKeyConstraint:
            baseTableName: audit_khkt_th_candidate
            baseColumnNames: audit_object_unit_id
            referencedTableName: risk_score_audit_object_unit
            referencedColumnNames: id
            constraintName: fk_audit_khkt_th_candidate_unit
        - addUniqueConstraint:
            tableName: audit_khkt_th_candidate
            columnNames: tenant_id, khkt_year, audit_object_code
            constraintName: uk_audit_khkt_th_candidate_year_object

  - changeSet:
      id: 159-2-audit-khkt-th-candidate-segment-schema
      author: govia
      comment: "Tao bang audit_khkt_th_candidate_segment (TH de xuat LVKT - nhieu-nhieu)"
      changes:
        - createTable:
            tableName: audit_khkt_th_candidate_segment
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true } }
              - column: { name: tenant_id, type: UUID, constraints: { nullable: false } }
              - column: { name: candidate_id, type: UUID, constraints: { nullable: false } }
              - column: { name: business_segment_id, type: UUID, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(64) }
              - column: { name: updated_at, type: TIMESTAMP }
              - column: { name: updated_by, type: VARCHAR(64) }
              - column: { name: row_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: audit_khkt_th_candidate_segment
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_audit_khkt_th_candidate_segment_tenant
        - addForeignKeyConstraint:
            baseTableName: audit_khkt_th_candidate_segment
            baseColumnNames: candidate_id
            referencedTableName: audit_khkt_th_candidate
            referencedColumnNames: id
            constraintName: fk_audit_khkt_th_candidate_segment_candidate
        - addForeignKeyConstraint:
            baseTableName: audit_khkt_th_candidate_segment
            baseColumnNames: business_segment_id
            referencedTableName: audit_master_data_item
            referencedColumnNames: id
            constraintName: fk_audit_khkt_th_candidate_segment_segment
        - addUniqueConstraint:
            tableName: audit_khkt_th_candidate_segment
            columnNames: tenant_id, candidate_id, business_segment_id
            constraintName: uk_audit_khkt_th_candidate_segment_pair

  - changeSet:
