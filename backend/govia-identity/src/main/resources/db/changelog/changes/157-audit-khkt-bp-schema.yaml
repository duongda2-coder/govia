            baseColumnNames: candidate_id
            referencedTableName: audit_khkt_bp_candidate
            referencedColumnNames: id
            constraintName: fk_audit_khkt_bp_candidate_segment_candidate
        - addForeignKeyConstraint:
            baseTableName: audit_khkt_bp_candidate_segment
            baseColumnNames: business_segment_id
            referencedTableName: audit_master_data_item
            referencedColumnNames: id
            constraintName: fk_audit_khkt_bp_candidate_segment_segment
        - addUniqueConstraint:
            tableName: audit_khkt_bp_candidate_segment
            columnNames: tenant_id, candidate_id, business_segment_id
            constraintName: uk_audit_khkt_bp_candidate_segment_pair

