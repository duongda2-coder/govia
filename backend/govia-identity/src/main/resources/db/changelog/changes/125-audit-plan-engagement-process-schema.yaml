databaseChangeLog:

  # ===================== "Lap ke hoach": Tao CKT quy trinh - file "Tao CKT (3).xlsx", sheet "man hinh tao CKT quy trinh" =====================
  - changeSet:
      id: 125-1-audit-process-engagement-schema
      author: govia
      comment: "Tao bang audit_process_engagement (CKT quy trinh)"
      changes:
        - createTable:
            tableName: audit_process_engagement
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true } }
              - column: { name: tenant_id, type: UUID, constraints: { nullable: false } }
              - column: { name: code, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: business_segment_id, type: UUID, constraints: { nullable: false } }
              - column: { name: engagement_year, type: INT, constraints: { nullable: false } }
              - column: { name: expected_month, type: INT, constraints: { nullable: false } }
              - column: { name: decision_date, type: DATE, constraints: { nullable: false } }
              - column: { name: team_lead_employee_id, type: UUID, constraints: { nullable: false } }
              - column: { name: decision_number, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(255) }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(64) }
              - column: { name: updated_at, type: TIMESTAMP }
              - column: { name: updated_by, type: VARCHAR(64) }
              - column: { name: row_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: audit_process_engagement
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_audit_process_engagement_tenant
        - addForeignKeyConstraint:
            baseTableName: audit_process_engagement
            baseColumnNames: business_segment_id
            referencedTableName: audit_master_data_item
            referencedColumnNames: id
            constraintName: fk_audit_process_engagement_segment
        - addForeignKeyConstraint:
            baseTableName: audit_process_engagement
            baseColumnNames: team_lead_employee_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_audit_process_engagement_team_lead
        - addUniqueConstraint:
            tableName: audit_process_engagement
            columnNames: tenant_id, code
            constraintName: uk_audit_process_engagement_tenant_code
