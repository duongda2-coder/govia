databaseChangeLog:

  # "Phong" - lien ket Danh muc nhan vien toi Danh muc Bo phan KT (audit_master_data_item, category=DEPARTMENT).
  - changeSet:
      id: 106-1-employee-department-link
      author: govia
      comment: "Them cot department_id vao bang employee, lien ket toi Danh muc Bo phan KT"
      changes:
        - addColumn:
            tableName: employee
            columns:
              - column: { name: department_id, type: UUID }
        - addForeignKeyConstraint:
            baseTableName: employee
            baseColumnNames: department_id
            referencedTableName: audit_master_data_item
            referencedColumnNames: id
            constraintName: fk_employee_department
