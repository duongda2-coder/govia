databaseChangeLog:

  # ===================== Bo sung 4 danh muc "Doi tuong kiem toan" vao sub-module Master Data CDRR =====================
  # Sheet ZTC_DTKT1-4 (file "Chấm điểm - master data (1).xlsx") - dung chung quyen AUDIT.RISK_SCORING.*
  # da co (013-016), khong tao permission moi vi day la danh muc them vao sub-module da co san.

  - changeSet:
      id: 019-1-risk-score-audit-object-unit
      author: govia
      comment: "Sheet ZTC_DTKT1 - Doi tuong kiem toan HO, Giam sat CC, Chi nhanh (bang ZTB_DTKT10)"
      changes:
        - createTable:
            tableName: risk_score_audit_object_unit
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true } }
              - column: { name: tenant_id, type: UUID, constraints: { nullable: false } }
              - column: { name: code, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: unit_type, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: established_date, type: DATE }
              - column: { name: restructure_date, type: DATE }
              - column: { name: restructure_note, type: VARCHAR(255) }
              - column: { name: total_staff, type: INT }
              - column: { name: leader_count, type: INT }
              - column: { name: staff_count, type: INT }
              - column: { name: rank_value, type: INT }
              - column: { name: defense_line_group_id, type: UUID }
              - column: { name: operating_regulation, type: VARCHAR(500) }
              - column: { name: main_function, type: VARCHAR(500) }
              - column: { name: key_findings, type: VARCHAR(500) }
              - column: { name: info_updated_date, type: DATE }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(64) }
              - column: { name: updated_at, type: TIMESTAMP }
              - column: { name: updated_by, type: VARCHAR(64) }
              - column: { name: row_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: risk_score_audit_object_unit
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_risk_score_ao_unit_tenant
        - addForeignKeyConstraint:
            baseTableName: risk_score_audit_object_unit
            baseColumnNames: defense_line_group_id
            referencedTableName: risk_score_group_ho
            referencedColumnNames: id
            constraintName: fk_risk_score_ao_unit_defense_line_group
        - addUniqueConstraint:
            tableName: risk_score_audit_object_unit
            columnNames: tenant_id, code
            constraintName: uk_risk_score_ao_unit_tenant_code

  - changeSet:
