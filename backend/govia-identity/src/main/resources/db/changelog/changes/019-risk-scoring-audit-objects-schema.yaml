              - column: { name: company_type, type: VARCHAR(100) }
              - column: { name: established_date, type: DATE }
              - column: { name: staff_count, type: INT }
              - column: { name: leader_count, type: INT }
              - column: { name: inspection_year, type: INT }
              - column: { name: inspection_result, type: VARCHAR(1000) }
              - column: { name: inspection_recommendation, type: VARCHAR(1000) }
              - column: { name: audit_year, type: INT }
              - column: { name: audit_result, type: VARCHAR(1000) }
              - column: { name: audit_recommendation, type: VARCHAR(1000) }
              - column: { name: revenue, type: "NUMERIC(20,2)" }
