server:
  port: ${PORT:8081}   # Render (va nhieu host khac) inject PORT luc runtime
  max-http-header-size: 65536   # Tomcat mac dinh 8KB - JWT nhung het permission cua SUPER_ADMIN da ~7.6KB,
                                 # cong them header trinh duyet that (Accept, Origin, Sec-Fetch-*...) vuot 8KB
                                 # va bi Tomcat tu choi truoc khi toi Spring (400 Bad Request, khong qua duoc
                                 # GlobalExceptionHandler nen loi tra ve la trang HTML mac dinh cua Tomcat).

spring:
  application:
    name: govia-identity
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  jpa:
    hibernate:
      ddl-auto: validate   # Schema quan ly boi Liquibase, khong de Hibernate tu sinh
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  # Chi thuc su duoc dung khi govia.notification.email.enabled=true (xem duoi). De trong (host
  # rong) thi Spring Boot van tao JavaMailSender ben trong nhung MailWorkflowNotificationService
  # dang tat nen khong ai goi send() - an toan khi chua co SMTP that.
  mail:
    host: ${GOVIA_SMTP_HOST:}
    port: ${GOVIA_SMTP_PORT:587}
    username: ${GOVIA_SMTP_USERNAME:}
    password: ${GOVIA_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

flowable:
  database-schema-update: true   # Flowable tu tao/migrate bang ACT_* rieng, khong quan ly qua Liquibase
  async-executor-activate: true  # can bat de Timer/Job chay duoc
  check-process-definitions: false  # tat auto-deploy classpath:/processes/ cua Flowable (khong gan tenantId) -
                                     # quy trinh mau duoc WorkflowSampleProcessSeeder tu deploy co tenantId cu the

govia:
  security:
    jwt:
      secret: ${GOVIA_JWT_SECRET:CHANGE_ME_dev_only_secret_key_min_32_bytes_______}
      access-token-minutes: 30
      refresh-token-days: 7
  attachment:
    root-path: ${GOVIA_ATTACHMENT_ROOT:./data/attachments}
    max-file-size-mb: 25
  llm:
    provider: ${GOVIA_LLM_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      model: ${OLLAMA_MODEL:qwen2.5:7b-instruct}
      timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
      # Tham so sinh (G4): nhiet do thap, gioi han token tra loi, ngu canh 8192 (mac dinh Ollama 4096 bi tran)
      temperature: ${OLLAMA_TEMPERATURE:0.1}
      max-tokens: ${OLLAMA_MAX_TOKENS:2048}
      context-size: ${OLLAMA_CONTEXT_SIZE:8192}
      access-client-id: ${OLLAMA_ACCESS_CLIENT_ID:}
      access-client-secret: ${OLLAMA_ACCESS_CLIENT_SECRET:}
    # Moi truong van hanh: GOVIA_LLM_PROVIDER=openai-compatible + vLLM chay model ~30B tren may GPU noi bo
    openai-compatible:
      base-url: ${LLM_BASE_URL:http://127.0.0.1:8000}
      model: ${LLM_MODEL:}
      api-key: ${LLM_API_KEY:}
      timeout-seconds: ${LLM_TIMEOUT_SECONDS:120}
    # Tim van ban theo nghia (RAG). De trong = tim theo tu khoa. Ollama: "ollama pull bge-m3" roi dat bge-m3
    embedding:
      model: ${LLM_EMBEDDING_MODEL:}
      timeout-seconds: ${LLM_EMBEDDING_TIMEOUT_SECONDS:60}
  # CONG TAC TAT AI: GOVIA_AGENT_ENABLED=false -> an nut AI, he thong nghiep vu chay nhu chua co AI.
  # GOVIA_AGENT_DISABLED_AGENTS=A1 -> tat rieng agent A1 (cau hoi chuyen ve A0).
  agent:
    enabled: ${GOVIA_AGENT_ENABLED:true}
    disabled-agents: ${GOVIA_AGENT_DISABLED_AGENTS:}
    history-messages: ${GOVIA_AGENT_HISTORY_MESSAGES:20}
    # CONG 3: AI doc NOI DUNG file dinh kem (Thu vien tai lieu, bang chung phat hien, luu tru bao cao TDKP).
    # MAC DINH TAT - chi bat sau khi ATTT phe duyet.
    file-reading:
      enabled: ${GOVIA_AGENT_FILE_READING_ENABLED:false}
      max-bytes: ${GOVIA_AGENT_FILE_MAX_BYTES:10485760}
      max-chars: ${GOVIA_AGENT_FILE_MAX_CHARS:20000}
    # G4: gioi han tro ly theo vai tro, vd "A6=TRUONG_DOAN|KSCL;A2=KE_HOACH" (trong = khong gioi han, SUPER_ADMIN luon duoc).
    agent-roles: ${GOVIA_AGENT_AGENT_ROLES:}
    # G4 (M3): job "Goi y AI" theo lich rieng cua module agent (khong timer BPMN, khong goi model, khong gui thu).
    schedule:
      enabled: ${GOVIA_AGENT_SCHEDULE_ENABLED:true}
      cron: "${GOVIA_AGENT_SCHEDULE_CRON:0 0 6 * * MON-FRI}"
      due-soon-days: ${GOVIA_AGENT_SCHEDULE_DUE_SOON_DAYS:7}
      stale-task-days: ${GOVIA_AGENT_SCHEDULE_STALE_TASK_DAYS:3}
  notification:
    email:
      # Mac dinh TAT: chua co SMTP that nao duoc cau hinh. Khi bat len (true) can dien them
      # spring.mail.host/port/username/password ben duoi - xem MailWorkflowNotificationService.
      enabled: ${GOVIA_NOTIFICATION_EMAIL_ENABLED:false}
      from: ${GOVIA_NOTIFICATION_EMAIL_FROM:no-reply@govia.local}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.govia: DEBUG

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${GOVIA_DB_URL:jdbc:postgresql://localhost:5432/govia}
    username: ${GOVIA_DB_USER:govia}
    password: ${GOVIA_DB_PASSWORD:govia}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

---
# Chi de CHAY THU local khi chua co Docker/Postgres - KHONG dung cho production.
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:govia;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
# Kich hoat bang: SPRING_PROFILES_ACTIVE=oracle, va bo comment dependency ojdbc11 trong pom.xml
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${GOVIA_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${GOVIA_DB_USER:govia}
    password: ${GOVIA_DB_PASSWORD:govia}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
