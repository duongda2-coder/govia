server:
  port: ${PORT:8081}   # Render (va nhieu host khac) inject PORT luc runtime

spring:
  application:
    name: govia-identity
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  jpa:
    hibernate:
      ddl-auto: validate   # Schema quan ly boi Liquibase, khong de Hibernate tu sinh
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

flowable:
  database-schema-update: true   # Flowable tu tao/migrate bang ACT_* rieng, khong quan ly qua Liquibase
  async-executor-activate: true  # can bat de Timer/Job chay duoc
  check-process-definitions: false  # tat auto-deploy classpath:/processes/ cua Flowable (khong gan tenantId) -
                                     # quy trinh mau duoc WorkflowSampleProcessSeeder tu deploy co tenantId cu the

govia:
  security:
    jwt:
      secret: ${GOVIA_JWT_SECRET:CHANGE_ME_dev_only_secret_key_min_32_bytes_______}
      access-token-minutes: 30
      refresh-token-days: 7
  attachment:
    root-path: ${GOVIA_ATTACHMENT_ROOT:./data/attachments}
    max-file-size-mb: 25
  llm:
    provider: ${GOVIA_LLM_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:7b-instruct}
      timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
      access-client-id: ${OLLAMA_ACCESS_CLIENT_ID:}
      access-client-secret: ${OLLAMA_ACCESS_CLIENT_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.govia: DEBUG

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${GOVIA_DB_URL:jdbc:postgresql://localhost:5432/govia}
    username: ${GOVIA_DB_USER:govia}
    password: ${GOVIA_DB_PASSWORD:govia}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

---
# Chi de CHAY THU local khi chua co Docker/Postgres - KHONG dung cho production.
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:govia;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
# Kich hoat bang: SPRING_PROFILES_ACTIVE=oracle, va bo comment dependency ojdbc11 trong pom.xml
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${GOVIA_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${GOVIA_DB_USER:govia}
    password: ${GOVIA_DB_PASSWORD:govia}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
