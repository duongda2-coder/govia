services:
  postgres:
    image: postgres:16-alpine
    container_name: govia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: govia
      POSTGRES_USER: govia
      POSTGRES_PASSWORD: govia
    ports:
      - "5432:5432"
    volumes:
      - govia-postgres-data:/var/lib/postgresql/data

volumes:
  govia-postgres-data:
